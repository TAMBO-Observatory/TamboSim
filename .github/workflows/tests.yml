name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - uses: julia-actions/cache@v2

      - name: Cache PROPOSAL tables
        uses: actions/cache@v4
        with:
          path: resources/proposal_tables
          key: proposal-tables-${{ hashFiles('src/julia_interfaces/proposal/**') }}
          restore-keys: proposal-tables-

      - name: Install dependencies
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project=. test/runtests.jl
