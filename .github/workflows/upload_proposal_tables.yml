name: Upload PROPOSAL tables

on:
  workflow_dispatch:

jobs:
  upload-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Generate PROPOSAL tables
        run: |
          julia --project=. -e '
            using TamboSim
            import TamboSim: init_proposal
            tables_path = abspath("resources/proposal_tables")
            mkpath(tables_path)
            init_proposal(Dict("tablespath" => tables_path, "vcut" => 0.5))
            println("Done: ", length(readdir(tables_path)), " files")
          '

      - name: Package tables
        run: |
          count=$(ls resources/proposal_tables/ | wc -l)
          echo "Packaging $count files from resources/proposal_tables/"
          tar -czf /tmp/proposal_tables.tar.gz -C resources proposal_tables/

      - name: Upload tables to release
        run: gh release upload proposal-tables-v1 /tmp/proposal_tables.tar.gz#proposal_tables.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
