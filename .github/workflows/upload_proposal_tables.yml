name: Upload PROPOSAL tables

on:
  workflow_dispatch:

jobs:
  upload-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'

      - uses: julia-actions/cache@v3

      - name: Install dependencies
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Generate PROPOSAL tables by running PROPOSAL tests
        run: julia --project=. test/runtests.jl "Julia Interfaces" "Injection Regression" "Propagation Decay Fraction" "Simulation API"
        # Running actual propagation ensures all process-specific tables are generated,
        # not just the main interpolation tables from init_proposal alone.
        # Some tests may fail for unrelated reasons — we only need the tables.
        continue-on-error: true

      - name: Package tables
        run: |
          count=$(ls resources/proposal_tables/ | wc -l)
          echo "Packaging $count files from resources/proposal_tables/"
          tar -czf /tmp/proposal_tables.tar.gz -C resources proposal_tables/

      - name: Upload tables to release
        run: gh release upload proposal-tables-v1 /tmp/proposal_tables.tar.gz#proposal_tables.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
