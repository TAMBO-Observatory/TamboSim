# Downgoing atmospheric muon configuration for the TAMBO site.
#
# Muons are injected directly as cosmic-ray primaries (strategy =
# "CosmicRayInjection", pdg = 13). Every injected muon is placed at the
# specified altitude and propagated down to the detector by CORSIKA.
#
# To weight events against the physical atmospheric muon flux, multiply each
# event's oneweight by Φ_μ(E, cosθ, h) evaluated at the injected energy, the
# local zenith at the injection point, and the injection altitude.
# TamboAtmMuonFlux.jl provides this flux model. The injection altitude is
# recorded on the M frame at m["injection"]["altitude"] (km).
#
# Altitude choice: the injection altitude is where Φ_μ is evaluated, so it
# must match the flux model and lie above all terrain in the geometry mesh,
# which reaches ~6.3 km above sea level. Campaigns at different altitudes are
# weighted independently and give separate rate estimates.

[geometry]
geometry_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_3000.jld2"

[injection]
strategy = "CosmicRayInjection"
seed = 925
nevent = 100000
pdg = 13       # muon (use -13 for anti-muon)
gamma = 2.7
emin = 1.0e2   # GeV
emax = 1.0e6   # GeV
thetamin = 91  # degrees (downgoing: zenith > 90°)
thetamax = 130 # degrees
phimin = 0     # degrees
phimax = 360   # degrees
altitude = 6.5 # km — above the highest terrain in the mesh; see note above

[corsika]
seed = 925
thinning = 1.0e-6
site_file = "resources/sites/colca.toml"
hadron_model = "SIBYLL-2.3d"
hadron_ecut = 1.0  # GeV
em_ecut = 1.0      # GeV
mu_ecut = 1.0      # GeV
corsika_path = "_TAMBOSIM_PATH_/src/corsika/tambo_shower/src/build/tambo_shower"

# Executor selection (optional; default = "run_local"):
#   executor = "run_sbatch"
#   executor_sbatch_prefix = "--time=01:00:00 --mem=4G"
# or
#   executor = "dump_to_file"
#   executor_dump_path = "jobs.jsonl"
