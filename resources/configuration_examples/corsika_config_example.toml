# You can use `_TAMBO_PATH_` and it will be replaced by the path to the Tambo source directory

[corsika]

parallelize_corsika = false
batch_submit_corsika = true
thinning = 1e-6
hadron_model = "SIBYLL-2.3d"
hadron_ecut = 0.05 # GeV
em_ecut = 0.001 # GeV

photon_ecut = 0.001 # GeV
mu_ecut = 0.05 # GeV
corsika_path = "_TAMBOSIM_PATH_/resources/corsika/src/build/tambo_shower"
obs_mesh_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_obs_surface.ply"
terrain_mesh_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_terrain.ply"
