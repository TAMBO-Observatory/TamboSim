# Downgoing cosmic-ray proton configuration for the Colca Valley site.
# Used as the proton counterpart to tau_neutrino_cc.toml. Adjust nevent
# for your run scale.
#
# Cosmic-ray protons are surface-injected primaries: every primary is
# guaranteed to produce a shower (no forced CC interaction is needed),
# so this config has no [proposal] section and no xs_location key —
# inject_protons! reads the spectrum/angular fields plus the optional
# altitude. The pdg value is recorded on the injection M frame for
# downstream weighting via build_phase_space.

[geometry]
earth_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley.h5:colca_valley_30000"
detector_key = "detector1"

[injection]
strategy = "CosmicRayInjection"
pinecone = 925
nevent = 100000
pdg = 2212
gamma = 2.7
emin = 1.0e3 # GeV
emax = 1.0e7 # GeV
thetamin = 91  # degrees (downgoing: zenith > 90°)
thetamax = 130 # degrees
phimin = 0     # degrees
phimax = 360   # degrees
altitude = 112.0 # km — sample primary along the trajectory at this altitude
track_progress = false

[corsika]
pinecone = 925
thinning = 1.0e-6
hadron_model = "SIBYLL-2.3d"
hadron_ecut = 1.0  # GeV
em_ecut = 1.0      # GeV
photon_ecut = 1.0  # GeV
mu_ecut = 1.0      # GeV
corsika_path = "_TAMBOSIM_PATH_/src/corsika/tambo_shower/build/tambo_shower"
obs_mesh_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_obs_surface.ply"
terrain_mesh_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_terrain.ply"
track_progress = false
