# Glashow-resonance ν̄_e configuration for the Colca Valley site:
# ν̄_e + e⁻ → W⁻ → τ⁻ ν̄_τ with the τ forced to interact near the detector.
# Adjust nevent for your run scale.

[geometry]
geometry_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_3000.jld2"

[injection]
strategy = "GlashowInjection"
seed = 925
nevent = 500000
pdg = -12
gamma = 1.0
emin = 1.0e6 # GeV
emax = 1.0e8 # GeV
thetamin = 0   # degrees
thetamax = 117 # degrees
phimin = 90    # degrees
phimax = 290   # degrees
# Only the CC DIS total is used here, for ν̄_e attenuation on nucleons.
xs_location = "_TAMBOSIM_PATH_/resources/cross_section_tables/cross_sections.h5:CSMS_nutau"
# true: multiply tree level by the Doppler + ISR ratios in group GR_nuebar of the same file.
glashow_corrections = false

[proposal]
seed = 925
ecut = -1   # GeV; negative means infinity (ionization-only threshold)
vcut = 1e-2
do_continuous = true
tablespath = "_TAMBOSIM_PATH_/resources/proposal_tables/"

[corsika]
seed = 925
thinning = 1.0e-6
site_file = "resources/sites/colca.toml"
hadron_model = "SIBYLL-2.3d"
hadron_ecut = 0.05   # GeV
em_ecut = 0.001      # GeV
mu_ecut = 0.05       # GeV
corsika_path = "_TAMBOSIM_PATH_/src/corsika/tambo_shower/src/build/tambo_shower"
