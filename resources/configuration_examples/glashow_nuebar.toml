# Glashow-resonance ν̄_e injection for the Colca Valley site.
# Energy range brackets the on-resonance peak at s = M_W^2, i.e. E_ν ≈ 6.3 PeV.

[geometry]
earth_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley.h5:colca_valley_30000"
detector_key = "detector1"

[injection]
strategy = "GlashowInjection"
pinecone = 925
nevent = 500000
pdg = -12         # ν̄_e
gamma = 1.5
emin = 1.0e5      # GeV
emax = 1.0e8      # GeV
thetamin = 0      # degrees
thetamax = 117    # degrees
phimin = 90       # degrees
phimax = 290      # degrees
track_progress = false

[proposal]
pinecone = 925
ecut = -1
vcut = 1e-2
do_interpolate = true
do_continuous = true
tablespath = "_TAMBOSIM_PATH_/resources/proposal_tables/"
track_progress = false

[corsika]
pinecone = 925
thinning = 1.0e-6
hadron_model = "SIBYLL-2.3d"
hadron_ecut = 0.05
em_ecut = 0.001
photon_ecut = 0.001
mu_ecut = 0.05
corsika_path = "_TAMBOSIM_PATH_/src/corsika/tambo_shower/build/tambo_shower"
obs_mesh_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_obs_surface.ply"
terrain_mesh_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_terrain.ply"
track_progress = false
