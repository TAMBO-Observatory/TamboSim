[geometry]
earth_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley.h5:colca_valley_30000"
detector_key = "detector1"

[injection]
pdg = 2212
pinecone = 925
nevent = 10000
gamma = 1.0
emin = 1.0e5    # GeV
emax = 1.0e6    # GeV
thetamin = 80   # degrees (downgoing: 90-180 in standard convention)
thetamax = 180  # degrees
phimin = 90
phimax = 270
altitude = 100.0 # km

[corsika]
pinecone = 925
thinning = 1.0e-6
hadron_model = "SIBYLL-2.3d"
hadron_ecut = 0.05 # GeV
em_ecut = 0.001 # GeV
photon_ecut = 0.001 # GeV
mu_ecut = 0.05 # GeV
corsika_path = "_TAMBOSIM_PATH_/resources/corsika/src/build/tambo_shower"
obs_mesh_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_obs_surface.ply"
terrain_mesh_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_terrain.ply"
