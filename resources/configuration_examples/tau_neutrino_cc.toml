# Standard tau-neutrino charged-current configuration for the Colca Valley site.
# Adjust nevent for your run scale.

[geometry]
geometry_path = "_TAMBOSIM_PATH_/resources/geometry/colca_valley_3000.jld2"


[injection]
strategy = "NeutrinoInjection"
seed = 925
nevent = 500000
pdg = 16
gamma = 1.5
emin = 3.0e5 # GeV
emax = 1.0e9 # GeV
thetamin = 0   # degrees
thetamax = 117 # degrees
phimin = 90    # degrees
phimax = 290   # degrees
xs_location = "_TAMBOSIM_PATH_/resources/cross_section_tables/cross_sections.h5:CSMS_nutau"

# Fraction of forced-CC events kept by injection-time accept/reject downsampling
# (default 1.0 = keep all). In general, the forced-CC population dominates
# the injection but not the physical rate; we can downsample at injection to
# spendd CORSIKA budget on the rate-dominant upstream-converted taus instead.
# Weighting compensates automatically.

# Our recommended fractions are energy dependent:
# 10PeV+        => 0.01
# 1PeV - 10PeV  => 1e-3
# 10TeV+        => 1e-4 or smaller

# forced_interaction_accept_fraction = 0.01

[proposal]
seed = 925
ecut = -1   # GeV; negative means infinity (ionization-only threshold)
vcut = 1e-2
do_continuous = true
tablespath = "_TAMBOSIM_PATH_/resources/proposal_tables/"


[corsika]
seed = 925
thinning = 1.0e-6
hadron_model = "SIBYLL-2.3d"
hadron_ecut = 0.05   # GeV
em_ecut = 0.001      # GeV
mu_ecut = 0.05       # GeV
corsika_path = "_TAMBOSIM_PATH_/src/corsika/tambo_shower/build/tambo_shower"

# Executor selection (optional; default = "run_local"):
#   executor = "run_sbatch"
#   executor_sbatch_prefix = "--time=01:00:00 --mem=4G"
# or
#   executor = "dump_to_file"
#   executor_dump_path = "jobs.jsonl"
