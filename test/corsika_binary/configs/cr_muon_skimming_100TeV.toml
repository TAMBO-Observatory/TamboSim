# Test case: energy-scaling stress on the terrain-rock path.
#
# A muon grazing the terrain at 10x the energy of cr_muon_skimming, held
# at a narrow fixed angle (this is the energy-stress point, not a fuzzer).
# RockEMAbsorber exists because a multi-TeV muon's in-rock brems/pair
# losses would otherwise seed 1e6-1e8 EM secondaries; this case is the
# tractability stress test for that path. Also combines the skimming
# geometry with the terrain crop. Expensive — kept to 2 showers.

name = "cr_muon_skimming_100TeV"
description = "Earth-skimming muon: 100 TeV, 95 deg zenith, max_radius_km = 30."

[injection]
strategy = "CosmicRayInjection"
seed     = 925
nevent   = 2
pdg      = 13
gamma    = 2.7
emin     = 1.0e5
emax     = 1.001e5
thetamin = 95
thetamax = 96
phimin   = 180
phimax   = 181
altitude = 6.0

[corsika]
seed          = 925
thinning      = 1.0e-6
site = "colca"
hadron_model  = "SIBYLL-2.3d"
em_ecut       = 0.001
hadron_ecut   = 0.05
mu_ecut       = 0.05
max_radius_km = 30
