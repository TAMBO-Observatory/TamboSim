# Test case: baseline hadronic air shower.
#
# A proton primary develops the full hadronic cascade (SIBYLL + UrQMD +
# decays + EM). Near-vertical downgoing geometry is the simplest case to
# reason about, so this is the interpretation anchor for energy
# conservation, profile shape, and ground particle counts.

name = "cr_proton_vertical"
description = "Baseline hadronic shower: proton, 10 TeV, near-vertical downgoing."
determinism_check = true   # Tier 4a reruns this case's first shower.

[injection]
strategy = "CosmicRayInjection"
seed     = 925
nevent   = 3
pdg      = 2212        # proton
gamma    = 2.7
emin     = 1.0e4       # GeV
emax     = 1.001e4     # GeV
thetamin = 179         # deg — downgoing (zenith > 90°)
thetamax = 180
phimin   = 180
phimax   = 181
altitude = 112.0       # km — primary sampled at this altitude along the trajectory

[corsika]
seed         = 925
thinning     = 1.0e-6
hadron_model = "SIBYLL-2.3d"
em_ecut      = 0.001   # GeV
hadron_ecut  = 0.05    # GeV
mu_ecut      = 0.05    # GeV
